# Netlify reads the Node version from .nvmrc and detects pnpm from packageManager.
[build]
  command = "pnpm build"
  publish = "dist"

# Netlify's secrets scanning fails the deploy when an environment variable's value is
# found in the repo or the build output. These values are public by design: the
# Firebase web config is embedded in the client bundle, and the owner UID is written in
# firestore.rules (security comes from the rules). GEMINI_API_KEY stays scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_APP_ID,OWNER_UID"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Firebase Auth helper served from the app's own origin, so redirect sign-in keeps
# working with third-party storage partitioning. Set VITE_FIREBASE_AUTH_DOMAIN to the
# site's domain in Netlify. https://firebase.google.com/docs/auth/web/redirect-best-practices
# Must stay before the SPA fallback.
[[redirects]]
  from = "/__/auth/*"
  to = "https://salva-dico.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://salva-dico.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# SPA fallback: every unknown path serves the app shell (React Router handles it).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # SAMEORIGIN, not DENY: the app frames the proxied /__/auth/ helper.
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # Content-Security-Policy is a <meta> tag injected at build time (see csp.ts).

# Hashed build assets never change: cache them forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker and manifest must always be revalidated so updates are picked up.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
